name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  generator:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: final-concept-st3215/generator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install cadquery
      - run: python -m unittest test_hx18
