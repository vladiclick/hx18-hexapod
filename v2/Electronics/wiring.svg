<text x="60" y="1660" class="t">Fiecare MG90S: portocaliu = semnal PCA · roșu = distribuție 5V · maro = distribuție GND.</text>
<text x="60" y="1700" class="t">ARM este blocat până la calibrare fizică. OE nu scoate alimentarea. D1 oprește servourile; D0 deconectează tot pack-ul.</text>
<text x="60" y="1740" class="s">Schema este funcțională, nu desen de PCB. Gabaritele cablurilor, protecția LiPo și curentul real trebuie verificate pe banc.</text>
<text x="60" y="1815" class="s">Intersecțiile fără punct nu sunt conectate; punctul colorat marchează o conexiune electrică.</text>
<text x="60" y="1780" class="s">Surse: Adafruit Feather V2 / PCA9685, NXP PCA9685, Pololu #5671/#2831, Gens ace GEA4502S60XT3.</text>
